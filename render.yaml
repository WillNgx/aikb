# Render Blueprint cho backend — Render → New → Blueprint → chọn repo này là tạo xong service.
# Biến có `sync: false` là SECRET: Render hỏi giá trị lúc tạo, KHÔNG bao giờ ghi giá trị vào file
# này (repo để public). Lấy giá trị từ file .env ở máy dev.
services:
  - type: web
    name: aikb-api # → https://aikb-api.onrender.com (frontend trỏ VITE_API_URL vào địa chỉ này + /api)
    runtime: node
    plan: free
    region: singapore # cùng khu vực với Supabase (ap-southeast-1) cho nhanh
    rootDir: backend
    # --include=dev: NODE_ENV=production làm `npm ci` bỏ devDependencies, mà build cần `typescript`
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # BẮT BUỘC production: thiếu thì lỗi server trả kèm stack trace và giới hạn truy cập chung bị tắt
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        value: https://wrxsxtdeyzvsbhncevmm.supabase.co
      # Domain frontend trên Vercel (vd https://aikb-xxx.vercel.app) — CORS chỉ nhận đúng domain này
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Tuỳ chọn — để trống nếu không dùng
      - key: GEMINI_API_KEY_2
        sync: false
      - key: CUSTOM_API_KEY
        sync: false
      # Anthropic Claude — chỉ dùng khi Admin chọn Claude ở trang Cấu hình AI
      - key: ANTHROPIC_API_KEY
        sync: false
      # ⚠️ Bot Telegram chỉ được chạy ở ĐÚNG MỘT nơi: điền token ở đây thì phải bỏ token khỏi .env ở
      # máy dev, nếu không hai nơi tranh nhau nhận tin và Telegram ngắt một bên (bot chết im lặng).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CONTACT
        sync: false

  # Bản "BE phục vụ luôn FE": một địa chỉ duy nhất (https://aikb-web.onrender.com) cho cả giao diện
  # lẫn API, dùng khi mạng công ty chặn Vercel. Service aikb-api + FE Vercel ở trên giữ nguyên.
  # Build cả FE (VITE_API_URL=/api → gọi API cùng origin) rồi build BE; không có rootDir vì cần thấy cả hai thư mục.
  - type: web
    name: aikb-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev --prefix frontend && npm run build --prefix frontend && npm ci --include=dev --prefix backend && npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_FRONTEND
        value: "true"
      # Biến VITE_* được "đóng" vào bản build FE lúc build, không đọc lúc chạy
      - key: VITE_API_URL
        value: /api
      - key: VITE_SUPABASE_URL
        value: https://wrxsxtdeyzvsbhncevmm.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://wrxsxtdeyzvsbhncevmm.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: CUSTOM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # CỐ Ý KHÔNG khai TELEGRAM_BOT_TOKEN: bot chỉ được chạy ở đúng MỘT nơi (aikb-api).
