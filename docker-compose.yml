version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kb_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kb_local
    ports:
      - '5432:5432'
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data

volumes:
  kb_postgres_data:
